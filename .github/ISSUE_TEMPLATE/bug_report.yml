name: Bug report
description: Report a reproducible defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, patient information, customer records, or confidential supplier data. Report security vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps and synthetic example data needed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "main, release tag, or commit SHA"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and logs
      description: Include relevant runtime versions and redacted logs. Remove secrets and personal data.
    validations:
      required: false
