name: verify

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://nischit:nischit_local@localhost:5432/nischit_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nischit_test
          POSTGRES_USER: nischit
          POSTGRES_PASSWORD: nischit_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nischit -d nischit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - run: pnpm test:integration
      - run: pnpm verify
      - run: docker compose config
