name: publish-images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      migrations: ${{ steps.filter.outputs.migrations }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
            backend:
              - 'apps/api/**'
              - 'apps/worker/**'
              - 'packages/domain/**'
              - 'packages/chains/**'
              - 'packages/storage/**'
            migrations:
              - 'db/**'
            shared:
              - 'Dockerfile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'compose.production.yaml'

  publish-web:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: web
          push: true
          build-args: NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ env.REGISTRY_IMAGE }}/web:main
            ${{ env.REGISTRY_IMAGE }}/web:sha-${{ github.sha }}
          cache-from: type=gha,scope=nischit-web
          cache-to: type=gha,mode=max,scope=nischit-web

  publish-backend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}/api:main
            ${{ env.REGISTRY_IMAGE }}/api:sha-${{ github.sha }}
          cache-from: type=gha,scope=nischit-api
          cache-to: type=gha,mode=max,scope=nischit-api

  publish-worker:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: worker
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}/worker:main
            ${{ env.REGISTRY_IMAGE }}/worker:sha-${{ github.sha }}
          cache-from: type=gha,scope=nischit-worker
          cache-to: type=gha,mode=max,scope=nischit-worker

  publish-migrations:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.migrations == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrate
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}/migrate:main
            ${{ env.REGISTRY_IMAGE }}/migrate:sha-${{ github.sha }}
          cache-from: type=gha,scope=nischit-migrate
          cache-to: type=gha,mode=max,scope=nischit-migrate
